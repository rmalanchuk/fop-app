<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: 'Inter', sans-serif; }
        .card { background: #ffffff; border-radius: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; }
        .tab-btn.active { color: #3b82f6; position: relative; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 25%; width: 50%; height: 3px; background: #3b82f6; border-radius: 3px; }
        details summary::-webkit-details-marker { display: none; }
        .animate-fade { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .chart-container { position: relative; height: 200px; width: 100%; }
    </style>
</head>
<body class="p-4 pb-20 max-w-lg mx-auto">

    <div class="text-center mb-8 pt-4">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Family Finance</h1>
        <p class="text-xs font-medium text-slate-400">Аналітика та капітал</p>
    </div>

    <div class="flex mb-8 bg-white p-1 rounded-2xl shadow-sm border border-slate-100 sticky top-4 z-50">
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-btn active flex-1 py-3 text-sm font-semibold transition-all">Головна</button>
        <button onclick="switchTab('archive')" id="tab-archive" class="tab-btn flex-1 py-3 text-sm font-semibold text-slate-400 transition-all">Аналітика</button>
    </div>

    <div id="content-dashboard" class="animate-fade">
        <div class="px-1 mb-3 flex justify-between items-end">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tight">Активність за місяць (UAH)</p>
            <p id="month-name" class="text-[10px] font-bold text-blue-500 uppercase"></p>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-10">
            <div class="card p-4 border-b-4 border-red-100">
                <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">Витрачено</p>
                <p id="stat-expenses" class="text-lg font-bold text-red-600">0 ₴</p>
            </div>
            <div class="card p-4 border-b-4 border-green-100">
                <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">Отримано</p>
                <p id="stat-income" class="text-lg font-bold text-green-600">0 ₴</p>
            </div>
        </div>
        <div class="flex items-center justify-between mb-5 px-1">
            <h2 class="text-lg font-bold text-slate-800">Операції</h2>
            <button id="btn-show-all" onclick="toggleExpand()" class="text-xs text-blue-600 font-bold hover:bg-blue-100 bg-blue-50 px-3 py-1.5 rounded-lg">Показати всі ➔</button>
        </div>
        <div id="journal" class="space-y-3"></div>
    </div>

    <div id="content-archive" class="hidden animate-fade">
        <div class="card p-6 mb-6">
            <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-6 tracking-widest flex items-center">
                <span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span> Витрати: останні 5 тижнів
            </h3>
            <div class="chart-container"><canvas id="weeklyChart"></canvas></div>
            <p class="text-[9px] text-slate-300 mt-4 text-center italic">* Останній тиждень триває до сьогодні</p>
        </div>

        <div class="flex items-center justify-between mb-8 bg-blue-50/50 p-2 rounded-2xl border border-blue-100">
            <button onclick="changeMonth(-1)" class="w-10 h-10 flex items-center justify-center bg-white rounded-xl text-blue-600 shadow-sm border border-blue-100 active:scale-95 transition-transform">◀</button>
            <div class="text-center">
                <span id="current-month-display" class="font-bold text-blue-900 uppercase text-[11px] tracking-widest block"></span>
                <span class="text-[8px] text-blue-400 uppercase font-bold tracking-tighter">архів записів</span>
            </div>
            <button onclick="changeMonth(1)" class="w-10 h-10 flex items-center justify-center bg-white rounded-xl text-blue-600 shadow-sm border border-blue-100 active:scale-95 transition-transform">▶</button>
        </div>

        <div class="space-y-4">
            <details class="card group"><summary id="summary-exp" class="p-5 flex justify-between items-center cursor-pointer list-none"></summary><div id="details-exp" class="px-5 pb-5 pt-2 text-sm text-slate-500 space-y-3 border-t border-slate-50"></div></details>
            <details class="card group"><summary id="summary-inc" class="p-5 flex justify-between items-center cursor-pointer list-none"></summary><div id="details-inc" class="px-5 pb-5 pt-2 text-sm text-slate-500 space-y-3 border-t border-slate-50"></div></details>
            <details class="card group"><summary id="summary-sav" class="p-5 flex justify-between items-center cursor-pointer list-none"></summary><div id="details-sav" class="px-5 pb-5 pt-2 text-sm text-slate-500 space-y-3 border-t border-slate-50"></div></details>
        </div>
    </div>

    <script>
        let allData = [], safeData = { UAH: 0, USD: 0, EUR: 0 }, isExpanded = false, currentMonthOffset = 0, myChart = null;

        function getSecretKey() {
            let key = localStorage.getItem('finance_key');
            if (!key) { key = prompt("Введіть SECRET_KEY:"); if (key) localStorage.setItem('finance_key', key); }
            return key;
        }

        function switchTab(tab) {
            document.getElementById('content-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('content-archive').classList.toggle('hidden', tab !== 'archive');
            document.getElementById('tab-dashboard').classList.toggle('active', tab === 'dashboard');
            document.getElementById('tab-archive').classList.toggle('active', tab === 'archive');
            if (tab === 'archive') renderArchive();
        }

        async function fetchData() {
            const key = getSecretKey(); if (!key) return;
            try {
                const res = await fetch(`https://fop-app-02d3.onrender.com/api/dashboard?key=${key}`);
                const data = await res.json();
                allData = data.history || [];
                safeData = data.safe || { UAH: 0, USD: 0, EUR: 0 };
                document.getElementById('month-name').innerText = new Intl.DateTimeFormat('uk-UA', { month: 'long' }).format(new Date());
                renderDashboard();
            } catch (e) { localStorage.removeItem('finance_key'); }
        }

        function toggleExpand() { isExpanded = !isExpanded; renderDashboard(); }

        function renderDashboard() {
            const now = new Date();
            const currentMonthData = allData.filter(t => {
                const d = new Date(t.created_at);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear() && t.currency === 'UAH';
            });
            document.getElementById('stat-expenses').innerText = currentMonthData.filter(t => t.type === 'Витрати').reduce((s, t) => s + Math.abs(t.amount), 0).toLocaleString() + ' ₴';
            document.getElementById('stat-income').innerText = currentMonthData.filter(t => t.type === 'Доходи').reduce((s, t) => s + Math.abs(t.amount), 0).toLocaleString() + ' ₴';

            const displayData = isExpanded ? allData : allData.slice(0, 5);
            document.getElementById('btn-show-all').innerText = isExpanded ? "Згорнути ▲" : "Показати всі ➔";
            document.getElementById('journal').innerHTML = displayData.map(t => {
                const isInc = t.type === 'Доходи', isSav = t.type === 'Заощадження';
                return `<div class="card p-4 flex justify-between items-center mb-3">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-xl ${isInc?'bg-green-50':isSav?'bg-blue-50':'bg-red-50'} flex items-center justify-center mr-4">${isInc?'💰':isSav?'🏦':'🛒'}</div>
                        <div><p class="font-bold text-sm text-slate-800">${t.category}</p><p class="text-[10px] text-slate-400">${new Date(t.created_at).toLocaleDateString('uk-UA')}</p></div>
                    </div>
                    <div class="text-right min-w-[75px]"><p class="font-bold ${isInc?'text-green-600':isSav?'text-blue-600':'text-red-600'} text-sm">${(isInc||(isSav&&t.amount>0))?'+':'-'}${Math.abs(t.amount).toLocaleString()} ${t.currency}</p></div>
                </div>`;
            }).join('');
        }

        function changeMonth(delta) { currentMonthOffset += delta; renderArchive(); }

        function renderArchive() {
            const targetDate = new Date(); targetDate.setMonth(targetDate.getMonth() + currentMonthOffset);
            document.getElementById('current-month-display').innerText = targetDate.toLocaleString('uk-UA', { month: 'long', year: 'numeric' });
            const filtered = allData.filter(t => {
                const d = new Date(t.created_at);
                return d.getMonth() === targetDate.getMonth() && d.getFullYear() === targetDate.getFullYear();
            });

            const stats = { exp: {}, inc: {}, sav: { UAH: 0, USD: 0, EUR: 0 } };
            filtered.forEach(t => {
                if (t.type === 'Витрати' && t.currency === 'UAH') stats.exp[t.category] = (stats.exp[t.category] || 0) + Math.abs(t.amount);
                if (t.type === 'Доходи' && t.currency === 'UAH') stats.inc[t.category] = (stats.inc[t.category] || 0) + Math.abs(t.amount);
                if (t.type === 'Заощадження') stats.sav[t.currency] = (stats.sav[t.currency] || 0) + Math.abs(t.amount);
            });

            updateSummary('exp', '💸', 'Витрати', Object.values(stats.exp).reduce((a,b)=>a+b,0).toLocaleString()+' ₴', stats.exp, 'text-red-600');
            updateSummary('inc', '💰', 'Доходи', Object.values(stats.inc).reduce((a,b)=>a+b,0).toLocaleString()+' ₴', stats.inc, 'text-green-600');
            document.getElementById(`summary-sav`).innerHTML = `<div class="flex items-center"><div class="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center mr-4">🏦</div><span class="font-bold text-sm text-slate-700">Капітал</span></div><span class="text-slate-300 text-xs">детальніше ➔</span>`;
            document.getElementById(`details-sav`).innerHTML = `<div class="flex justify-between"><span>🇺🇦 Гривня</span><span class="font-bold text-blue-600">${stats.sav.UAH.toLocaleString()} ₴</span></div><div class="flex justify-between"><span>🇺🇸 Долар</span><span class="font-bold text-blue-600">${stats.sav.USD.toLocaleString()} $</span></div><div class="flex justify-between"><span>🇪🇺 Євро</span><span class="font-bold text-blue-600">${stats.sav.EUR.toLocaleString()} €</span></div>`;
            renderChart(allData);
        }

        function updateSummary(id, icon, label, totalStr, categories, colorClass) {
            document.getElementById(`summary-${id}`).innerHTML = `<div class="flex items-center"><div class="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center mr-4">${icon}</div><span class="font-bold text-sm text-slate-700">${label}</span></div><span class="font-bold ${colorClass}">${totalStr}</span>`;
            document.getElementById(`details-${id}`).innerHTML = Object.entries(categories).map(([cat, val]) => `<div class="flex justify-between"><span>${cat}</span><span class="font-semibold text-slate-700">${val.toLocaleString()} ₴</span></div>`).join('') || 'Немає даних';
        }

        function renderChart(data) {
            const ctx = document.getElementById('weeklyChart').getContext('2d'), weeks = [], now = new Date();
            for (let i = 4; i >= 0; i--) {
                const end = new Date(now); end.setDate(now.getDate() - (i * 7));
                const start = new Date(end); start.setDate(end.getDate() - 6);
                weeks.push({ start, end, amount: 0, label: i === 0 ? 'Поточний' : `${i} тижд. тому` });
            }
            data.filter(t => t.type === 'Витрати' && t.currency === 'UAH').forEach(t => {
                const d = new Date(t.created_at);
                weeks.forEach(w => { if (d >= w.start && d <= w.end) w.amount += Math.abs(t.amount); });
            });
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: weeks.map(w => w.label), datasets: [{ data: weeks.map(w => w.amount), backgroundColor: (c) => c.index === 4 ? '#93c5fd' : '#3b82f6', borderRadius: 8 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } } }
            });
        }
        window.onload = fetchData;
    </script>
</body>
</html>
