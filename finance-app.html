<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: 'Inter', sans-serif; }
        .card { background: #ffffff; border-radius: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; }
        .tab-active { color: #3b82f6; position: relative; }
        .tab-active::after { content: ''; position: absolute; bottom: 0; left: 25%; width: 50%; height: 3px; background: #3b82f6; border-radius: 3px; }
        
        .income-op { border-left: 4px solid #10b981; }
        .expense-op { border-left: 4px solid #ef4444; }
        .savings-op { border-left: 4px solid #3b82f6; }
        
        details summary::-webkit-details-marker { display: none; }
        .animate-fade { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 pb-20 max-w-lg mx-auto">

    <div class="flex justify-between items-center mb-8 pt-2">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Family Finance</h1>
            <p class="text-xs font-medium text-slate-400">Аналітика та капітал</p>
        </div>
        <div class="h-9 px-3 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center border border-blue-100">
            <span class="text-[10px] font-bold uppercase tracking-widest italic">Live Sync</span>
        </div>
    </div>

    <div class="flex mb-8 bg-white p-1 rounded-2xl shadow-sm border border-slate-100 sticky top-4 z-50">
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-3 text-sm font-semibold transition-all tab-active">Головна</button>
        <button onclick="switchTab('archive')" id="tab-archive" class="flex-1 py-3 text-sm font-semibold text-slate-400 transition-all">Аналітика</button>
    </div>

    <div id="content-dashboard" class="animate-fade">
        <div class="px-1 mb-3 flex justify-between items-end">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tight">Витрати за поточний місяць</p>
            <p id="month-name" class="text-[10px] font-bold text-blue-500 uppercase"></p>
        </div>
        <div class="grid grid-cols-3 gap-3 mb-10">
            <div class="card p-4 text-center border-b-4 border-red-100">
                <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">₴ UAH</p>
                <p id="safe-uah" class="text-sm font-bold text-slate-800">0</p>
            </div>
            <div class="card p-4 text-center border-b-4 border-red-100">
                <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">$ USD</p>
                <p id="safe-usd" class="text-sm font-bold text-slate-800">0</p>
            </div>
            <div class="card p-4 text-center border-b-4 border-red-100">
                <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">€ EUR</p>
                <p id="safe-eur" class="text-sm font-bold text-slate-800">0</p>
            </div>
        </div>

        <div class="flex items-center justify-between mb-5 px-1">
            <h2 class="text-lg font-bold text-slate-800">Операції</h2>
            <button id="btn-show-all" onclick="renderDashboard(true)" class="text-xs text-blue-600 font-bold hover:bg-blue-100 bg-blue-50 px-3 py-1.5 rounded-lg">Показати всі ➔</button>
        </div>
        
        <div id="journal" class="space-y-3">
            <div class="text-center py-10 text-slate-400 animate-pulse text-sm">Завантаження...</div>
        </div>
    </div>

    <div id="content-archive" class="hidden animate-fade">
        <div class="flex items-center justify-between mb-6 bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
            <button onclick="changeMonth(-1)" class="w-10 h-10 flex items-center justify-center bg-slate-50 rounded-xl text-slate-400 hover:text-blue-500">◀</button>
            <span id="current-month-display" class="font-bold text-slate-700 uppercase text-[11px] tracking-widest">Квітень 2026</span>
            <button onclick="changeMonth(1)" class="w-10 h-10 flex items-center justify-center bg-slate-50 rounded-xl text-slate-400 hover:text-blue-500">▶</button>
        </div>

        <div class="card p-6 mb-6">
            <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-6 tracking-widest flex items-center">
                <span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span> Динаміка витрат (UAH)
            </h3>
            <canvas id="weeklyChart" height="180"></canvas>
        </div>

        <div class="space-y-4">
            <details class="card group">
                <summary class="p-5 flex justify-between items-center cursor-pointer list-none">
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-red-50 rounded-xl flex items-center justify-center mr-4 text-red-500">💸</div>
                        <span class="font-bold text-slate-700 text-sm">Витрати</span>
                    </div>
                    <span id="total-exp" class="font-bold text-red-600">0 ₴</span>
                </summary>
                <div id="details-exp" class="px-5 pb-5 pt-2 text-sm text-slate-500 space-y-3 border-t border-slate-50"></div>
            </details>

            <details class="card group">
                <summary class="p-5 flex justify-between items-center cursor-pointer list-none">
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-green-50 rounded-xl flex items-center justify-center mr-4 text-green-500">💰</div>
                        <span class="font-bold text-slate-700 text-sm">Доходи</span>
                    </div>
                    <span id="total-inc" class="font-bold text-green-600">0 ₴</span>
                </summary>
                <div id="details-inc" class="px-5 pb-5 pt-2 text-sm text-slate-500 space-y-3 border-t border-slate-50"></div>
            </details>

            <details class="card group">
                <summary class="p-5 flex justify-between items-center cursor-pointer list-none">
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center mr-4 text-blue-500">🏦</div>
                        <span class="font-bold text-slate-700 text-sm">Капітал</span>
                    </div>
                    <span id="total-sav-sum" class="font-bold text-blue-600">0 ₴</span>
                </summary>
                <div id="details-sav" class="px-5 pb-5 pt-2 text-sm text-slate-500 space-y-3 border-t border-slate-50"></div>
            </details>
        </div>
    </div>

    <script>
        let allData = [];
        let safeData = { UAH: 0, USD: 0, EUR: 0 };
        let currentViewDate = new Date();
        let myChart;
    
        function getSecretKey() {
            let key = sessionStorage.getItem('finance_key');
            if (!key) {
                key = prompt("Введіть ваш секретний ключ (SECRET_KEY):");
                if (key) sessionStorage.setItem('finance_key', key);
            }
            return key;
        }
    
        async function fetchData() {
            const key = getSecretKey();
            if (!key) return;
    
            try {
                // Звертаємось до твого API на Render
                const res = await fetch(`https://fop-app-02d3.onrender.com/api/dashboard?key=${key}`);
                
                if (!res.ok) {
                    if (res.status === 401) {
                        alert("Невірний ключ!");
                        sessionStorage.removeItem('finance_key');
                        location.reload();
                    }
                    throw new Error("Сервер повернув помилку");
                }
    
                const data = await res.json();
                console.log("Дані з бекенду:", data); // Подивись сюди в консолі (F12)
    
                allData = data.history || [];
                safeData = data.safe || { UAH: 0, USD: 0, EUR: 0 };
    
                renderDashboard(false);
            } catch (e) {
                console.error("Помилка:", e);
                document.getElementById('journal').innerHTML = `<p class='text-center py-10 text-red-400 text-xs'>Помилка завантаження. Перевір консоль.</p>`;
            }
        }
    
        function renderDashboard(showAll = false) {
            // Відображаємо назву місяця
            const now = new Date();
            document.getElementById('month-name').innerText = new Intl.DateTimeFormat('uk-UA', { month: 'long' }).format(now);
    
            // Виводимо залишки в сейфі (які порахував бекенд)
            document.getElementById('safe-uah').innerText = safeData.UAH.toLocaleString() + ' ₴';
            document.getElementById('safe-usd').innerText = safeData.USD.toLocaleString() + ' $';
            document.getElementById('safe-eur').innerText = safeData.EUR.toLocaleString() + ' €';
    
            const journal = document.getElementById('journal');
            if (allData.length === 0) {
                journal.innerHTML = "<p class='text-center py-10 text-slate-400 text-sm'>Операцій не знайдено</p>";
                return;
            }
    
            const displayData = showAll ? allData : allData.slice(0, 8);
            if (showAll) document.getElementById('btn-show-all').style.display = 'none';
    
            journal.innerHTML = displayData.map(t => {
                const isInc = t.type === 'Доходи';
                const isSav = t.type === 'Заощадження';
                const sign = (isInc || (isSav && t.amount > 0)) ? '+' : '-';
                
                let icon = '🛒', iconBg = 'bg-red-50 text-red-500', textColor = 'text-red-600';
                if (isInc) { icon = '💰'; iconBg = 'bg-green-50 text-green-600'; textColor = 'text-green-600'; }
                else if (isSav) { icon = '🏦'; iconBg = 'bg-blue-50 text-blue-600'; textColor = 'text-blue-600'; }
    
                return `
                    <div class="card p-4 flex justify-between items-center mb-3">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-xl ${iconBg} flex items-center justify-center text-lg mr-4">${icon}</div>
                            <div>
                                <p class="font-bold text-slate-800 text-sm leading-tight">${t.category}</p>
                                <p class="text-[10px] text-slate-400 font-medium">${new Date(t.created_at).toLocaleDateString('uk-UA')}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold ${textColor} text-sm">${sign}${Math.abs(t.amount).toLocaleString()} ${t.currency}</p>
                            ${t.is_from_savings ? '<p class="text-[8px] font-black text-blue-500 uppercase tracking-tighter">З капіталу</p>' : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
    
        // Решта функцій (switchTab, renderArchive тощо) залишаються
        window.onload = fetchData;
    </script>
</body>
</html>
