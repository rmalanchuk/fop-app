<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ФОП Роман Маланчук</title>
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-bottom: 60px; }
        .container { width: 100%; max-width: 450px; margin: auto; }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 5px; }
        .card { background: var(--card); padding: 18px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .q-title { font-weight: 800; color: var(--primary); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        input { width: 45%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 10px; text-align: right; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--primary); }
        .res-box { background: #f8fafc; border-left: 4px solid #10b981; padding: 12px; border-radius: 12px; margin-top: 15px; font-size: 0.85rem; line-height: 1.5; }
        .res-line { display: flex; justify-content: space-between; border-bottom: 1px solid #eef2f6; padding: 2px 0; }
        .res-line b { color: #334155; }
        .val { font-weight: 700; color: var(--primary); }
        .clear-btn { background: #fee2e2; color: #b91c1c; border: none; padding: 12px; border-radius: 12px; width: 100%; margin-top: 20px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>ФОП Роман Маланчук</h1>
    <p style="text-align: center; opacity: 0.6; font-size: 0.8rem; margin-bottom: 20px;">Податковий помічник (Декларація 2025)</p>

    <div id="app"></div>
    <button class="clear-btn" onclick="clearData()">Очистити всі дані за рік</button>
</div>

<script>
    const months = [
        ["Січень", "Лютий", "Березень"],
        ["Квітень", "Травень", "Червень"],
        ["Липень", "Серпень", "Вересень"],
        ["Жовтень", "Листопад", "Грудень"]
    ];

    function initApp() {
        let html = '';
        months.forEach((qMonths, qIdx) => {
            html += `
                <div class="card">
                    <div class="q-title"><span>${qIdx + 1} Квартал</span></div>
                    ${qMonths.map((m, mIdx) => `
                        <div class="row">
                            <span>${m}</span>
                            <input type="text" inputmode="decimal" id="m-${qIdx}-${mIdx}" oninput="saveAndCalc()" placeholder="0.00">
                        </div>
                    `).join('')}
                    <div class="res-box" id="res-${qIdx}">Введіть дохід...</div>
                </div>
            `;
        });
        document.getElementById('app').innerHTML = html;
        loadData();
    }

    function saveAndCalc() {
        const data = {};
        document.querySelectorAll('input').forEach(input => {
            data[input.id] = input.value.replace(',', '.');
        });
        localStorage.setItem('fop_data_2025_v3', JSON.stringify(data));
        calculateAll();
    }

    function loadData() {
        const saved = localStorage.getItem('fop_data_2025_v3');
        if (saved) {
            const data = JSON.parse(saved);
            Object.keys(data).forEach(id => {
                const input = document.getElementById(id);
                if (input) input.value = data[id].replace('.', ',');
            });
        }
        calculateAll();
    }

    function calculateAll() {
        let cumulativeIncome = 0;
        let prevTaxSumEP = 0;
        let prevTaxSumVZ = 0;

        months.forEach((_, qIdx) => {
            let qIncome = 0;
            for (let mIdx = 0; mIdx < 3; mIdx++) {
                const val = document.getElementById(`m-${qIdx}-${mIdx}`).value.replace(',', '.');
                qIncome += parseFloat(val) || 0;
            }
            
            cumulativeIncome += qIncome;
            const totalTaxEP = cumulativeIncome * 0.05; // Р
