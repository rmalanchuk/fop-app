<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ФОП Роман</title>
    <style>
        :root { --p: #007aff; --bg: #f2f2f7; --c: #ffffff; --t: #1c1c1e; --s: #8e8e93; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 20px; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .year-input { border: 1px solid #d1d1d6; border-radius: 10px; padding: 8px; width: 80px; text-align: center; font-size: 16px; font-weight: bold; background: white; }
        .tabs { display: flex; background: rgba(118,118,128,0.12); border-radius: 12px; padding: 2px; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .tab.active { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: var(--p); }
        .card { background: var(--c); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .input-amt { width: 55%; padding: 12px; border: 1.5px solid #e5e5ea; border-radius: 12px; font-size: 17px; text-align: right; outline: none; }
        .input-amt:focus { border-color: var(--p); }
        .res-box { border-top: 1px solid #f2f2f7; margin-top: 20px; padding-top: 20px; }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 700; }
        .res-val { color: var(--p); font-size: 18px; }
        .det-btn { background: #f2f2f7; border: none; width: 100%; padding: 12px; border-radius: 12px; color: var(--p); font-weight: 600; margin-top: 10px; cursor: pointer; }
        .details { display: none; margin-top: 20px; border-top: 1px dashed #d1d1d6; padding-top: 15px; }
        .field-item { display: flex; align-items: flex-start; margin-bottom: 12px; font-size: 13px; line-height: 1.4; }
        .f-num { background: #ffd43b; color: #000; font-weight: 800; padding: 2px 6px; border-radius: 4px; min-width: 25px; text-align: center; margin-right: 10px; font-size: 11px; }
        .f-sum { font-weight: 700; color: var(--p); margin-right: 8px; white-space: nowrap; }
        .f-desc { color: #48484a; flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div style="font-size: 20px; font-weight: 800;">Роман Маланчук</div>
        <input type="number" id="yField" class="year-input" value="2025" onchange="changeYear()">
    </div>
    <div class="tabs">
        <div class="tab active" onclick="switchTab(0, this)">Q1</div>
        <div class="tab" onclick="switchTab(1, this)">Q2</div>
        <div class="tab" onclick="switchTab(2, this)">Q3</div>
        <div class="tab" onclick="switchTab(3, this)">Q4</div>
    </div>
    <div class="card">
        <div id="inputs-container"></div>
        <div class="res-box">
            <div class="res-row"><span>До сплати ЄП:</span> <span id="pay-ep" class="res-val">0.00 ₴</span></div>
            <div id="vz-row" class="res-row" style="display:none;"><span>До сплати ВЗ:</span> <span id="pay-vz" class="res-val">0.00 ₴</span></div>
            <button class="det-btn" onclick="toggleDet()">Колонки в декларації</button>
            <div id="det-sec" class="details"></div>
        </div>
    </div>
</div>

<script>
    let curY = 2025, curT = 0;
    const mons = [["Січень","Лютий","Березень"],["Квітень","Травень","Червень"],["Липень","Серпень","Вересень"],["Жовтень","Листопад","Грудень"]];
    let db = JSON.parse(localStorage.getItem('fop_vFinal_v3')) || {};

    function changeYear() { curY = parseInt(document.getElementById('yField').value); updateUI(); }
    function switchTab(t, el) { 
        curT = t; 
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        updateUI(); 
    }

    function updateUI() {
        document.getElementById('inputs-container').innerHTML = mons[curT].map((m, i) => {
            const key = `${curY}-${curT}-${i}`;
            const val = db[key] || '';
            return `
                <div class="row">
                    <span>${m}</span>
                    <input type="text" class="input-amt" inputmode="decimal" id="inp-${i}" value="${val.replace('.', ',')}" oninput="saveVal(${i}, this.value)">
                </div>
            `;
        }).join('');
        calculate();
    }

    function saveVal(idx, val) {
        db[`${curY}-${curT}-${idx}`] = val.replace(',', '.');
        localStorage.setItem('fop_vFinal_v3', JSON.stringify(db));
        calculate();
    }

    function calculate() {
        let qSums = [0,0,0,0];
        // Рахуємо суми для всіх кварталів поточного року
        for(let q=0; q<=3; q++) {
            for(let m=0; m<=2; m++) {
                qSums[q] += parseFloat(db[`${curY}-${q}-${m}`]) || 0;
            }
        }

        let cumInc = 0; for(let i=0; i<=curT; i++) cumInc += qSums[i];
        let prvInc = 0; for(let i=0; i<curT; i++) prvInc += qSums[i];
